<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="none">
  <defs>
    <!-- Gradient for water-like color variation -->
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4DD0E1;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#1B7FBD;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#76E4C3;stop-opacity:0.5" />
    </linearGradient>
    
    <!-- Filter for soft glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Caustic light patterns - organic curved shapes mimicking light refraction through water -->
  <g fill="url(#waterGradient)" filter="url(#glow)" opacity="0.8">
    <!-- Primary caustic curves -->
    <path d="M 0,200 Q 100,150 200,180 T 400,200 T 600,180 T 800,200 L 800,250 Q 600,230 400,250 T 200,230 Q 100,200 0,250 Z">
      <animate attributeName="d" 
               dur="8s" 
               repeatCount="indefinite"
               values="
                 M 0,200 Q 100,150 200,180 T 400,200 T 600,180 T 800,200 L 800,250 Q 600,230 400,250 T 200,230 Q 100,200 0,250 Z;
                 M 0,220 Q 100,180 200,200 T 400,180 T 600,200 T 800,180 L 800,230 Q 600,200 400,230 T 200,200 Q 100,230 0,230 Z;
                 M 0,200 Q 100,150 200,180 T 400,200 T 600,180 T 800,200 L 800,250 Q 600,230 400,250 T 200,230 Q 100,200 0,250 Z"
      />
    </path>
    
    <!-- Secondary caustic curves -->
    <path d="M 0,350 Q 150,300 300,330 T 600,350 T 800,330 L 800,400 Q 600,380 300,400 T 0,380 Z" opacity="0.6">
      <animate attributeName="d" 
               dur="10s" 
               repeatCount="indefinite"
               values="
                 M 0,350 Q 150,300 300,330 T 600,350 T 800,330 L 800,400 Q 600,380 300,400 T 0,380 Z;
                 M 0,330 Q 150,380 300,350 T 600,330 T 800,350 L 800,380 Q 600,400 300,380 T 0,400 Z;
                 M 0,350 Q 150,300 300,330 T 600,350 T 800,330 L 800,400 Q 600,380 300,400 T 0,380 Z"
      />
    </path>
    
    <!-- Tertiary subtle patterns -->
    <ellipse cx="200" cy="100" rx="80" ry="60" opacity="0.4">
      <animate attributeName="cx" dur="12s" repeatCount="indefinite" values="200;250;200" />
      <animate attributeName="cy" dur="15s" repeatCount="indefinite" values="100;130;100" />
    </ellipse>
    
    <ellipse cx="500" cy="450" rx="100" ry="70" opacity="0.3">
      <animate attributeName="cx" dur="14s" repeatCount="indefinite" values="500;450;500" />
      <animate attributeName="cy" dur="11s" repeatCount="indefinite" values="450;480;450" />
    </ellipse>
    
    <!-- Additional floating light patches -->
    <circle cx="650" cy="250" r="40" opacity="0.5">
      <animate attributeName="cx" dur="9s" repeatCount="indefinite" values="650;620;650" />
      <animate attributeName="r" dur="7s" repeatCount="indefinite" values="40;50;40" />
    </circle>
    
    <circle cx="150" cy="500" r="35" opacity="0.4">
      <animate attributeName="cy" dur="13s" repeatCount="indefinite" values="500;470;500" />
      <animate attributeName="r" dur="8s" repeatCount="indefinite" values="35;45;35" />
    </circle>
  </g>
</svg>
